name: Detect moves

# Scans ESPN's news feed for transactions worth writing up, and has Claude
# draft the §7 rubric for the ones that survive.
#
# What passes validation IS published, carrying a visible "not checked yet"
# badge. Krish wants to open the site and find the news there rather than run a
# command, so the gate is mechanical instead of human.
#
# What FAILS validation goes to content/moves/_drafts/, which the loader cannot
# see. So the failure mode is a missing entry, never a wrong one. The guard
# below also stops the job from ever modifying an entry that already exists.
#
# Separate from refresh-slate.yml on purpose: the slate has a hard September 9
# deadline and must never fail because a news endpoint changed shape.

on:
  schedule:
    # 12:00 UTC daily, an hour after the slate refresh so the two don't race
    # for the same push.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detect-moves
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Builtins only — no install needed, so a broken dependency can't stop
      # detection. Out of season this correctly finds nothing.
      - name: Detect candidates
        run: node scripts/detect-moves.mjs
        continue-on-error: true

      # Only the drafting step needs the SDK.
      - name: Install
        run: npm ci

      # Exits 0 with no key, which is the current state — ANTHROPIC_API_KEY is
      # not yet in repo secrets, so this writes nothing until it is.
      - name: Draft candidates
        run: npm run draft:moves
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Guard against the one thing that must never happen: a generated file
      # landing where the site would render it.
      # The job now publishes, so it must be allowed to ADD entries — but it
      # must never touch one that already exists. Hand-written entries have
      # been fact-checked; a generated file overwriting one would silently
      # replace verified content with a machine guess.
      - name: Refuse to modify an existing move
        run: |
          changed=$(git status --porcelain -- content/moves/ ':!content/moves/_drafts/' | grep -v '^??' || true)
          if [ -n "$changed" ]; then
            echo "This job may only add new move files, never change existing ones:"
            echo "$changed"
            exit 1
          fi

      - name: Commit if changed
        run: |
          # The directory is kept in the repo by a .gitkeep, but create it
          # anyway: with no API key the drafting script exits before it would
          # mkdir, and a missing path makes `git add` fail with exit 128.
          mkdir -p content/moves/_drafts
          # status --porcelain, not diff --quiet: a newly written draft is an
          # UNTRACKED file, which diff does not report. That would have
          # silently dropped the first draft this job ever produced.
          if [ -z "$(git status --porcelain -- src/data/ content/moves/)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name  "field-guide bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/ content/moves/
          # "draft:" prefix so these filter out of the history that should read
          # as a record of actual work (§3).
          # "moves:" rather than "draft:" — these reach the site now.
          git commit -m "moves: auto-published ($(date -u +%Y-%m-%d))"
          # Push can lose a race with a human pushing to main — that is exactly
          # how the 13 August refresh was lost, after committing cleanly. Rebase
          # onto whatever landed and try again rather than dropping the data.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase --autostash || exit 1
          done
          echo "Still could not push after three attempts."
          exit 1
