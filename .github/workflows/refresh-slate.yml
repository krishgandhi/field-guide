name: Refresh slate

# Pulls the week's games, spreads and injuries from ESPN and commits the result.
# The commit triggers the normal Vercel deploy, so pages stay fully static and
# never call ESPN at request time (CLAUDE.md §4).
#
# GitHub Actions rather than Vercel Cron: Vercel's Hobby plan caps cron at once
# per day and rejects more frequent expressions at deploy time. This also keeps
# every data change visible as a git diff.

on:
  schedule:
    # 11:00 UTC daily — about 7am Eastern, before the 1pm Sunday games and
    # after Wednesday/Thursday/Friday injury reports have landed.
    - cron: "0 11 * * *"
  # So the pipeline can be proven before anyone relies on the schedule.
  workflow_dispatch:

# Least privilege: the job pushes one file and touches nothing else.
permissions:
  contents: write

# A slow run must never overlap the next day's.
concurrency:
  group: refresh-slate
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No npm install for the fetch: it uses only Node builtins, so a broken
      # dependency can never stop a data refresh.
      - name: Fetch slate
        run: node scripts/fetch-slate.mjs

      # Also builtins-only. continue-on-error is load-bearing: without it a
      # standings outage aborts the job before the commit step and the slate
      # refresh is lost too — the opposite of the point of splitting them.
      # The slate step above stays blocking, because that one failing is worth
      # a red build.
      - name: Fetch standings
        run: node scripts/fetch-standings.mjs
        continue-on-error: true

      # Depth charts, coaches and unit ratings. Reads standings.json, so it
      # must run after the standings step above.
      - name: Fetch team detail
        run: node scripts/fetch-team-detail.mjs
        continue-on-error: true

      # Profiles for the people named in move entries, plus their headshots.
      # Builtins-only and continue-on-error: a missing profile card is
      # cosmetic, and must never cost the slate.
      - name: Fetch people
        run: node scripts/fetch-people.mjs
        continue-on-error: true

      # Only the prose steps need dependencies.
      - name: Install
        run: npm ci

      # continue-on-error on purpose: if Claude is unreachable, the key is
      # missing, or a sentence fails validation, the slate is already correct
      # and the app falls back to deterministic templates. Losing nice prose is
      # cosmetic; losing the schedule is not.
      - name: Write reasons
        run: npm run write:reasons
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Writes the one-line description for anyone who lacks one. Cached, so
      # this is a no-op on most days.
      - name: Write profile lines
        run: npm run write:profiles
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # What KIND of unit each one is. Hashed on its evidence, so this is a
      # no-op on most days.
      - name: Write unit notes
        run: npm run write:units
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- src/data/ public/players/)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          # Author as Krish, not as an unrecognised bot address. Vercel only
          # builds commits whose Git author it recognises, and every one of the
          # 14 commits made as bot@users.noreply.github.com was rejected with
          # "Deployment was blocked" — so the data refreshed in the repo and
          # never once reached the live site. The name still reads as the bot,
          # so `git log` stays honest about what wrote it.
          git config user.name  "field-guide bot"
          git config user.email "krishgandhi2017@gmail.com"
          git add src/data/ public/players/
          # "data:" prefix so these filter out of the history that should stay
          # readable as a record of actual work (§3).
          git commit -m "data: refresh ($(date -u +%Y-%m-%d))"
          # Push can lose a race with another push to main. Rebase and retry,
          # preferring OUR version of any conflict: everything this job commits
          # is generated output, and the fresh run is by definition the correct
          # one. A plain rebase deadlocked on slate.json, where two runs rewrite
          # the same timestamped file and every line conflicts.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git fetch origin main || exit 1
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase failed outright; leaving main untouched."
              exit 1
            fi
          done
          echo "Still could not push after three attempts."
          exit 1
