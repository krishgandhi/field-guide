name: Check Claude key

# On-demand: does ANTHROPIC_API_KEY work, and does the API still accept the
# request shape each writer sends (model ids, structured output, the
# server-side-fallback beta)?
#
# Worth having because the daily job rarely calls Claude now: every writer
# reads its cache first (src/data/prose-cache.json), and out of season the
# moves detector finds nothing. A call that never runs is a call nobody has
# checked lately. Each self-test makes one real request from a fixture and
# fails if nothing usable comes back; a rejected key or request exits 3 with
# the reason (scripts/lib/claude.mts).
#
# Writes nothing. Run it from the Actions tab after rotating the key, or before
# a trade deadline when the pipeline is about to matter.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Draft a move from a fixture
        run: npm run draft:moves -- --self-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Each runs regardless of the last, so one failure doesn't hide another.
      - name: Write a game preview from a fixture
        if: always()
        run: npm run write:reasons -- --self-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Write a profile line from a fixture
        if: always()
        run: npm run write:profiles -- --self-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Write three unit notes from the committed data
        if: always()
        run: npm run write:units -- --self-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
